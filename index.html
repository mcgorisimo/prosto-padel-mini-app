<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const marker = '[prosto-padel] client error details suppressed';
        const writeMarker = console.error.bind(console);
        const sanitizedConsoleError = () => writeMarker(marker);
        console.error = sanitizedConsoleError;
        const suppressRawWindowError = (event) => {
          if (event.target !== window) return;
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          sanitizedConsoleError();
        };
        const suppressRawRejection = (event) => {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          sanitizedConsoleError();
        };
        window.addEventListener('error', suppressRawWindowError, true);
        window.addEventListener(
          'unhandledrejection',
          suppressRawRejection,
          true,
        );
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Мета-тег для корректного масштабирования на мобильных устройствах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Просто Падел — клубное приложение</title>
    
    <!-- Скрипт для интеграции с Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
