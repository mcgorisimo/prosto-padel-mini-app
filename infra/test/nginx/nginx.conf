upstream prosto_padel_backend {
    server backend:3000;
}

upstream prosto_padel_frontend {
    server frontend:8080;
}

log_format pii_safe escape=json
    '{"level":"info","message":{"event":"nginx_access","method":"$request_method",'
    '"statusCode":$status,"bytesSent":$body_bytes_sent,"durationSeconds":$request_time}}';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log pii_safe;

    location = /api/v1/metrics {
        access_log off;
        return 404;
    }

    location = /api/v1/metrics/ {
        access_log off;
        return 404;
    }

    location = /api/v1/profile/me/photo {
        client_max_body_size 8m;
        proxy_pass http://prosto_padel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://prosto_padel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://prosto_padel_frontend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://prosto_padel_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
