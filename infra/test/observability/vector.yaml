data_dir: /var/lib/vector

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  docker_gelf:
    type: socket
    address: 0.0.0.0:12201
    mode: udp
    decoding:
      codec: gelf

  internal_metrics:
    type: internal_metrics

transforms:
  normalize_docker:
    type: remap
    inputs:
      - docker_gelf
    source: |
      .environment = "test"
      container_tag = to_string(._tag) ?? ""
      container_name = to_string(._container_name) ?? ""
      if container_tag != "" {
        .service = container_tag
      } else if container_name != "" {
        .service = container_name
      } else {
        .service = "unknown"
      }
      .event = "unclassified"
      .domain = "none"
      .level = to_string(.level) ?? "unknown"

      raw = to_string(.message) ?? ""
      application, parse_error = parse_json(raw)
      if parse_error == null && is_object(application) {
        .application = application
        .level = to_string(application.level) ?? .level
        if is_object(application.message) {
          .event = to_string(application.message.event) ?? .event
          .domain = to_string(application.message.domain) ?? .domain
        }
      }

sinks:
  loki:
    type: loki
    inputs:
      - normalize_docker
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      environment: "{{ environment }}"
      service: "{{ service }}"
      level: "{{ level }}"
      event: "{{ event }}"
      domain: "{{ domain }}"
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    healthcheck:
      enabled: true

  prometheus_exporter:
    type: prometheus_exporter
    inputs:
      - internal_metrics
    address: 0.0.0.0:9598
