global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    application: prosto-padel
    environment: test

rule_files:
  - /etc/prometheus/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: backend
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - backend:3000

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: vector
    static_configs:
      - targets:
          - vector:9598

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
