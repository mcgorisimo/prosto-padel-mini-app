services:
  backend:
    environment:
      APP_RELEASE_SHA_REQUIRED: "true"
      APP_RELEASE: ${APP_RELEASE:?APP_RELEASE must be an exact lowercase 40-character commit SHA}
      DATABASE_URL: !reset null
      DATABASE_PASSWORD: !reset null
      DATABASE_ENABLED: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: prosto_padel_test_migration_cycle
      DATABASE_USER: backend_auth_app
      DATABASE_PASSWORD_FILE: /run/secrets/backend-auth-app-password
      YCLIENTS_WEBHOOK_ENABLED: ${YCLIENTS_WEBHOOK_ENABLED:-false}
      YCLIENTS_COMPANY_ID: ${YCLIENTS_COMPANY_ID:-}
      YCLIENTS_API_ENABLED: ${YCLIENTS_API_ENABLED:-false}
      YCLIENTS_BOOKING_WRITE_ENABLED: ${YCLIENTS_BOOKING_WRITE_ENABLED:-false}
      YCLIENTS_API_BASE_URL: ${YCLIENTS_API_BASE_URL:-https://api.yclients.com}
      YCLIENTS_PARTNER_TOKEN: !reset null
      YCLIENTS_USER_TOKEN: !reset null
      YCLIENTS_PARTNER_TOKEN_FILE: /run/secrets/yclients-partner-token
      YCLIENTS_USER_TOKEN_FILE: /run/secrets/yclients-user-token
      RESERVATION_SNAPSHOT_MASTER_KEY_BASE64: !reset null
      RESERVATION_SNAPSHOT_MASTER_KEY_BASE64_FILE: /run/secrets/reservation-snapshot-master-key-base64
      RESERVATION_SNAPSHOT_KEY_VERSION: ${RESERVATION_SNAPSHOT_KEY_VERSION:-1}
      TELEGRAM_AUTH_ENABLED: ${TELEGRAM_AUTH_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: !reset null
      TELEGRAM_IDENTITY_LOOKUP_PEPPER_BASE64: !reset null
      TELEGRAM_LOGIN_WORKFLOW_HMAC_SECRET_BASE64: !reset null
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:?TELEGRAM_INIT_DATA_MAX_AGE_SECONDS is required}
      TELEGRAM_LOGIN_UUID_NAMESPACE: ${TELEGRAM_LOGIN_UUID_NAMESPACE:?TELEGRAM_LOGIN_UUID_NAMESPACE is required}
      TELEGRAM_OUTBOUND_NOTIFICATIONS_ENABLED: ${TELEGRAM_OUTBOUND_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-https://app.prostopdl.ru/}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram-bot-token
      TELEGRAM_IDENTITY_LOOKUP_PEPPER_BASE64_FILE: /run/secrets/telegram-identity-lookup-pepper-base64
      TELEGRAM_LOGIN_WORKFLOW_HMAC_SECRET_BASE64_FILE: /run/secrets/telegram-login-workflow-hmac-secret-base64
      PROFILE_PHOTO_STORAGE_ENABLED: ${PROFILE_PHOTO_STORAGE_ENABLED:-false}
      PROFILE_PHOTO_STORAGE_ENDPOINT: ${PROFILE_PHOTO_STORAGE_ENDPOINT:-}
      PROFILE_PHOTO_STORAGE_REGION: ${PROFILE_PHOTO_STORAGE_REGION:-}
      PROFILE_PHOTO_STORAGE_BUCKET: ${PROFILE_PHOTO_STORAGE_BUCKET:-}
      PROFILE_PHOTO_PUBLIC_BASE_URL: ${PROFILE_PHOTO_PUBLIC_BASE_URL:-}
      PROFILE_PHOTO_STORAGE_ACCESS_KEY_ID: !reset null
      PROFILE_PHOTO_STORAGE_SECRET_ACCESS_KEY: !reset null
      PROFILE_PHOTO_STORAGE_ACCESS_KEY_ID_FILE: /run/secrets/profile-photo-access-key-id
      PROFILE_PHOTO_STORAGE_SECRET_ACCESS_KEY_FILE: /run/secrets/profile-photo-secret-access-key
    volumes:
      - type: bind
        source: ${BACKEND_AUTH_APP_PASSWORD_FILE_HOST:?BACKEND_AUTH_APP_PASSWORD_FILE_HOST is required}
        target: /run/secrets/backend-auth-app-password
        read_only: true
      - type: bind
        source: ${TELEGRAM_BOT_TOKEN_FILE_HOST:?TELEGRAM_BOT_TOKEN_FILE_HOST is required}
        target: /run/secrets/telegram-bot-token
        read_only: true
      - type: bind
        source: ${TELEGRAM_IDENTITY_LOOKUP_PEPPER_BASE64_FILE_HOST:?TELEGRAM_IDENTITY_LOOKUP_PEPPER_BASE64_FILE_HOST is required}
        target: /run/secrets/telegram-identity-lookup-pepper-base64
        read_only: true
      - type: bind
        source: ${TELEGRAM_LOGIN_WORKFLOW_HMAC_SECRET_BASE64_FILE_HOST:?TELEGRAM_LOGIN_WORKFLOW_HMAC_SECRET_BASE64_FILE_HOST is required}
        target: /run/secrets/telegram-login-workflow-hmac-secret-base64
        read_only: true
      - type: bind
        source: ${PROFILE_PHOTO_STORAGE_ACCESS_KEY_ID_FILE_HOST:?PROFILE_PHOTO_STORAGE_ACCESS_KEY_ID_FILE_HOST is required}
        target: /run/secrets/profile-photo-access-key-id
        read_only: true
      - type: bind
        source: ${PROFILE_PHOTO_STORAGE_SECRET_ACCESS_KEY_FILE_HOST:?PROFILE_PHOTO_STORAGE_SECRET_ACCESS_KEY_FILE_HOST is required}
        target: /run/secrets/profile-photo-secret-access-key
        read_only: true
      - type: bind
        source: ${YCLIENTS_PARTNER_TOKEN_FILE_HOST:?YCLIENTS_PARTNER_TOKEN_FILE_HOST is required}
        target: /run/secrets/yclients-partner-token
        read_only: true
      - type: bind
        source: ${YCLIENTS_USER_TOKEN_FILE_HOST:?YCLIENTS_USER_TOKEN_FILE_HOST is required}
        target: /run/secrets/yclients-user-token
        read_only: true
      - type: bind
        source: ${RESERVATION_SNAPSHOT_MASTER_KEY_BASE64_FILE_HOST:?RESERVATION_SNAPSHOT_MASTER_KEY_BASE64_FILE_HOST is required}
        target: /run/secrets/reservation-snapshot-master-key-base64
        read_only: true

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: !reset null
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
    volumes:
      - type: bind
        source: ${GRAFANA_ADMIN_PASSWORD_FILE_HOST:?GRAFANA_ADMIN_PASSWORD_FILE_HOST is required}
        target: /run/secrets/grafana-admin-password
        read_only: true
