name: prosto-padel-test

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${TEST_POSTGRES_IMAGE:-postgres:14-bookworm}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-prosto_padel_test_migration_cycle}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-prosto_padel_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-local_test_password_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - test_internal

  backend:
    build:
      context: ../../backend
      args:
        NODE_IMAGE: ${TEST_NODE_IMAGE:-node:20.11.0-bookworm-slim}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: "3000"
      CRM_PROVIDER: disabled
      DATABASE_ENABLED: "true"
      DATABASE_URL: postgresql://${TEST_POSTGRES_USER:-prosto_padel_test}:${TEST_POSTGRES_PASSWORD:-local_test_password_only}@postgres:5432/${TEST_POSTGRES_DB:-prosto_padel_test_migration_cycle}
      TELEGRAM_AUTH_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ""
      PLAYER_ONBOARDING_LEGAL_POLICY_ENABLED: ${PLAYER_ONBOARDING_LEGAL_POLICY_ENABLED:-false}
      PLAYER_ONBOARDING_TERMS_VERSION: ${PLAYER_ONBOARDING_TERMS_VERSION:-}
      PLAYER_ONBOARDING_PRIVACY_VERSION: ${PLAYER_ONBOARDING_PRIVACY_VERSION:-}
      PLAYER_ONBOARDING_CANCELLATION_VERSION: ${PLAYER_ONBOARDING_CANCELLATION_VERSION:-}
      PLAYER_ONBOARDING_PERSONAL_DATA_PROCESSING_VERSION: ${PLAYER_ONBOARDING_PERSONAL_DATA_PROCESSING_VERSION:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - test_internal
      - test_egress

  frontend:
    build:
      context: ../..
      dockerfile: infra/test/frontend/Dockerfile
      args:
        VITE_TELEGRAM_BACKEND_LOGIN_ENABLED: ${VITE_TELEGRAM_BACKEND_LOGIN_ENABLED:-true}
        VITE_ONBOARDING_LEGAL_PUBLISHED: ${VITE_ONBOARDING_LEGAL_PUBLISHED:-false}
        VITE_ONBOARDING_LEGAL_POLICY_ALIGNED: ${VITE_ONBOARDING_LEGAL_POLICY_ALIGNED:-false}
        VITE_ONBOARDING_LEGAL_TEST_ONLY: ${VITE_ONBOARDING_LEGAL_TEST_ONLY:-false}
        VITE_ONBOARDING_TERMS_URL: ${VITE_ONBOARDING_TERMS_URL:-}
        VITE_ONBOARDING_TERMS_VERSION: ${VITE_ONBOARDING_TERMS_VERSION:-}
        VITE_ONBOARDING_PRIVACY_URL: ${VITE_ONBOARDING_PRIVACY_URL:-}
        VITE_ONBOARDING_PRIVACY_VERSION: ${VITE_ONBOARDING_PRIVACY_VERSION:-}
        VITE_ONBOARDING_CANCELLATION_URL: ${VITE_ONBOARDING_CANCELLATION_URL:-}
        VITE_ONBOARDING_CANCELLATION_VERSION: ${VITE_ONBOARDING_CANCELLATION_VERSION:-}
        VITE_ONBOARDING_PERSONAL_DATA_CONSENT_URL: ${VITE_ONBOARDING_PERSONAL_DATA_CONSENT_URL:-}
        VITE_ONBOARDING_PERSONAL_DATA_CONSENT_VERSION: ${VITE_ONBOARDING_PERSONAL_DATA_CONSENT_VERSION:-}
    restart: unless-stopped
    logging: *bounded-logging
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8080/healthz >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - test_edge

  nginx:
    image: ${TEST_NGINX_IMAGE:-nginx:1.27.4-alpine}
    restart: unless-stopped
    logging: *bounded-logging
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8080/api/v1/health >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - test_edge
      - test_internal

  auth-integration-runner:
    build:
      context: ../../backend
      dockerfile: ../infra/test/auth-integration/Dockerfile
      args:
        NODE_IMAGE: ${TEST_NODE_IMAGE:-node:20.11.0-bookworm-slim}
    profiles:
      - auth-integration
    init: true
    logging: *bounded-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test_internal

  db-tools:
    image: ${TEST_POSTGRES_IMAGE:-postgres:14-bookworm}
    working_dir: /workspace
    profiles:
      - tools
    restart: "no"
    logging: *bounded-logging
    environment:
      EXPECTED_TEST_DATABASE_HOST: ${EXPECTED_TEST_DATABASE_HOST:-postgres}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-prosto_padel_test_migration_cycle}
      DATABASE_USER: ${DATABASE_USER:-prosto_padel_test}
      PGPASSWORD: ${TEST_POSTGRES_PASSWORD:-local_test_password_only}
    volumes:
      - ../../docs/migrations:/workspace/migrations:ro
      - ./sql:/workspace/test/sql:ro
      - ./scripts:/workspace/test/scripts:ro
      - ./backups:/workspace/test/backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - psql
      - --version
    networks:
      - test_internal

networks:
  test_edge:
    driver: bridge
  test_internal:
    internal: true
  test_egress:
    driver: bridge

volumes:
  postgres_data:
